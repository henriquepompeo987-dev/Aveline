<!-- ================= CABEÇALHO FIXO ================= -->
<header class="sticky top-0 z-40 w-full glass-nav border-b border-brand-border/60 transition-all duration-300">
  <div class="max-w-[1380px] mx-auto px-4 sm:px-8 py-3 flex items-center justify-between gap-4">

    <!-- Menu mobile -->
    <button onclick="toggleMobileMenu(true)" class="tap-target lg:hidden -ml-2 text-brand-dark/80 hover:text-brand-wine" aria-label="Abrir menu">
      <span class="material-symbols-outlined text-[24px]">menu</span>
    </button>

    <!-- Logo -->
    <a href="#inicio" class="flex items-center gap-3 group">
      <svg viewBox="0 0 60 100" class="h-10 w-auto shrink-0" fill="none" stroke="#B08B55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M30 6 C36 14, 40 24, 38 33 C36 38, 24 38, 22 33 C20 24, 24 14, 30 6 Z"/>
        <path d="M30 10 C30 19, 30 28, 30 36" stroke-width="1.1"/>
        <path d="M26 13 C24 21, 24 29, 25 36" stroke-width="1.1"/>
        <path d="M34 13 C36 21, 36 29, 35 36" stroke-width="1.1"/>
        <path d="M23 29 C18 28, 14 30, 11 34 C16 36, 21 34, 24 31"/>
        <path d="M37 29 C42 28, 46 30, 49 34 C44 36, 39 34, 36 31"/>
        <path d="M30 38 C30 50, 31 62, 31 74 C31 84, 29 90, 27 94"/>
        <path d="M31 60 C24 58, 14 52, 7 42 C15 40, 26 49, 31 60 Z"/>
        <path d="M31 60 C24 54, 15 47, 8 42" stroke-width="1.1"/>
        <path d="M24 55.5 C23 53, 22 50.5, 21.5 48" stroke-width="1.1"/>
        <path d="M17.5 49.5 C17 47.5, 16.5 45.5, 16 43.5" stroke-width="1.1"/>
        <path d="M31 70 C38 68, 46 62, 53 50 C45 48, 36 59, 31 70 Z"/>
        <path d="M31 70 C38 64, 45 57, 52 50" stroke-width="1.1"/>
        <path d="M38 64.5 C38.5 62, 39 59.5, 39.5 57" stroke-width="1.1"/>
        <path d="M44.5 58.5 C45 56.5, 45.5 54.5, 46 52.5" stroke-width="1.1"/>
      </svg>
      <div class="flex flex-col">
        <span class="font-serif text-xl sm:text-2xl font-bold tracking-[0.25em] text-brand-wine leading-none">AVELINE</span>
        <span class="hidden sm:block text-[8px] font-semibold tracking-[0.35em] text-brand-gold uppercase mt-1 whitespace-nowrap -ml-0.5">Perfumes Importados</span>
      </div>
    </a>

    <!-- Navegação principal -->
    <nav class="hidden lg:flex items-center gap-2 xl:gap-2.5" id="main-nav">
      <a href="#inicio" class="nav-pill" data-section="inicio">Início</a>
      <a href="#catalogo" onclick="filterCatalog('todos')" class="nav-pill" data-section="catalogo">Perfumes</a>
      <a href="#catalogo" onclick="filterCatalog('feminino')" class="nav-pill">Femininos</a>
      <a href="#catalogo" onclick="filterCatalog('masculino')" class="nav-pill">Masculinos</a>
      <a href="#catalogo" onclick="filterCatalog('unissex')" class="nav-pill">Unissex</a>
      <a href="#catalogo" onclick="filterCatalog('nicho')" class="nav-pill">Nicho</a>
      <a href="#decantes" class="nav-pill" data-section="decantes">Decantes</a>
      <a href="#catalogo" onclick="filterCatalog('lancamentos')" class="nav-pill">Lançamentos</a>
      <a href="#sobre" class="nav-pill" data-section="sobre">Sobre</a>
    </nav>

    <!-- Ícones -->
    <div class="flex items-center gap-0.5 sm:gap-2">
      <button onclick="toggleSearch(true)" class="tap-target text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50" title="Pesquisar" aria-label="Pesquisar">
        <span class="material-symbols-outlined text-[22px]">search</span>
      </button>
      <button onclick="openAccountModal()" class="tap-target hidden sm:inline-flex text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50" title="Minha Conta" aria-label="Minha conta">
        <span class="material-symbols-outlined text-[22px]">person</span>
      </button>
      <button onclick="toggleWishlistDrawer(true)" class="tap-target text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50 relative" title="Favoritos" aria-label="Favoritos">
        <span class="material-symbols-outlined text-[22px]">favorite</span>
        <span id="wishlist-badge" class="hidden absolute top-0.5 right-0.5 bg-brand-wine text-white text-[10px] w-4 h-4 rounded-full items-center justify-center font-bold">0</span>
      </button>
      <button onclick="toggleCart(true)" class="tap-target text-brand-wine bg-brand-cream/60 hover:bg-brand-cream transition-colors rounded-full relative flex items-center gap-1.5 px-3" title="Sacola" aria-label="Sacola">
        <span class="material-symbols-outlined text-[20px]">local_mall</span>
        <span id="cart-counter" class="text-xs font-bold text-brand-wine">0</span>
      </button>
    </div>

  </div>
</header>
