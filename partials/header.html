<!-- ================= CABEÇALHO FIXO ================= -->
<header class="sticky top-0 z-40 w-full glass-nav border-b border-brand-border/60 transition-all duration-300">
  <div class="max-w-[1380px] mx-auto px-4 sm:px-8 py-3 flex items-center justify-between gap-4">

    <!-- Menu mobile -->
    <button onclick="toggleMobileMenu(true)" class="tap-target lg:hidden -ml-2 text-brand-dark/80 hover:text-brand-wine" aria-label="Abrir menu">
      <span class="material-symbols-outlined text-[24px]">menu</span>
    </button>

    <!-- Logo -->
    <a href="#inicio" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-full flex items-center justify-center bg-white/60">
        <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" stroke="#541623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="50" cy="50" r="47" stroke-width="3"/>
          <circle cx="50" cy="50" r="41.5" stroke-width="1.3"/>
          <path d="M50 21 C56.5 30, 59 40, 56.5 48.5 C53.5 52.5, 46.5 52.5, 43.5 48.5 C41 40, 43.5 30, 50 21 Z"/>
          <path d="M50 25.5 C51.3 34, 51.3 42, 50 48.5" stroke-width="1.1"/>
          <path d="M45.8 30 C44.6 37, 44.6 43.5, 45.8 48.5" stroke-width="1.1"/>
          <path d="M54.2 30 C55.4 37, 55.4 43.5, 54.2 48.5" stroke-width="1.1"/>
          <path d="M50 48.5 C50 59, 50 69, 47.5 79"/>
          <path d="M49.5 63 C41 60, 33 55.5, 27.5 48 C35 45.5, 44 52, 49.5 63 Z"/>
          <path d="M49.5 63 C42.5 58, 35 53, 28.5 48.5" stroke-width="1.1"/>
          <path d="M50 58.5 C58.5 55.5, 66.5 51, 72 43.5 C64.5 41, 55.5 47.5, 50 58.5 Z"/>
          <path d="M50 58.5 C57 53.5, 64.5 48.5, 71 44" stroke-width="1.1"/>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="font-serif text-xl sm:text-2xl font-bold tracking-[0.25em] text-brand-wine leading-none">AVELINE</span>
        <span class="hidden sm:block text-[8px] font-semibold tracking-[0.45em] text-brand-gold uppercase mt-1">Perfumes Importados</span>
      </div>
    </a>

    <!-- Navegação principal -->
    <nav class="hidden lg:flex items-center gap-6 xl:gap-8 text-[11px] tracking-[0.16em] uppercase font-semibold text-brand-dark/80" id="main-nav">
      <a href="#inicio" class="nav-link" data-section="inicio">Início</a>
      <a href="#catalogo" onclick="filterCatalog('todos')" class="nav-link" data-section="catalogo">Perfumes</a>
      <a href="#catalogo" onclick="filterCatalog('feminino')" class="nav-link">Femininos</a>
      <a href="#catalogo" onclick="filterCatalog('masculino')" class="nav-link">Masculinos</a>
      <a href="#catalogo" onclick="filterCatalog('unissex')" class="nav-link">Unissex</a>
      <a href="#catalogo" onclick="filterCatalog('nicho')" class="nav-link">Nicho</a>
      <a href="#decantes" class="nav-link" data-section="decantes">Decantes</a>
      <a href="#catalogo" onclick="filterCatalog('lancamentos')" class="nav-link">Lançamentos</a>
      <a href="#sobre" class="nav-link whitespace-nowrap" data-section="sobre">Sobre</a>
    </nav>

    <!-- Ícones -->
    <div class="flex items-center gap-0.5 sm:gap-2">
      <button onclick="toggleSearch(true)" class="tap-target text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50" title="Pesquisar" aria-label="Pesquisar">
        <span class="material-symbols-outlined text-[22px]">search</span>
      </button>
      <button onclick="openAccountModal()" class="tap-target hidden sm:inline-flex text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50" title="Minha Conta" aria-label="Minha conta">
        <span class="material-symbols-outlined text-[22px]">person</span>
      </button>
      <button onclick="toggleWishlistDrawer(true)" class="tap-target text-brand-dark/80 hover:text-brand-wine transition-colors rounded-full hover:bg-brand-cream/50 relative" title="Favoritos" aria-label="Favoritos">
        <span class="material-symbols-outlined text-[22px]">favorite</span>
        <span id="wishlist-badge" class="hidden absolute top-0.5 right-0.5 bg-brand-wine text-white text-[10px] w-4 h-4 rounded-full items-center justify-center font-bold">0</span>
      </button>
      <button onclick="toggleCart(true)" class="tap-target text-brand-wine bg-brand-cream/60 hover:bg-brand-cream transition-colors rounded-full relative flex items-center gap-1.5 px-3" title="Sacola" aria-label="Sacola">
        <span class="material-symbols-outlined text-[20px]">local_mall</span>
        <span id="cart-counter" class="text-xs font-bold text-brand-wine">0</span>
      </button>
    </div>

  </div>
</header>
