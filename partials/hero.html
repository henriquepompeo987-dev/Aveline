<!-- ================= HERO (ESTILO EDITORIAL) ================= -->
<section id="inicio" class="relative bg-brand-surface overflow-hidden border-b border-brand-border">
  <div class="max-w-[1380px] mx-auto px-4 sm:px-8 py-16 lg:py-24 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

    <!-- Título e chamadas -->
    <div class="lg:col-span-6 space-y-6 z-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-brand-gold/20 text-brand-gold text-[10px] tracking-[0.2em] uppercase font-bold rounded-sm border border-brand-gold/40">
        <span class="material-symbols-outlined text-[14px]">diamond</span>
        Alta Perfumaria & Curadoria de Nicho
      </div>
      <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl text-brand-wine leading-[1.1] font-normal">
        Descubra fragrâncias que contam histórias.
      </h1>
      <p class="text-base sm:text-lg text-brand-dark/80 leading-relaxed font-light max-w-xl">
        Uma curadoria especial de perfumes importados para transformar fragrância em assinatura.
      </p>

      <div class="pt-2 flex flex-wrap items-center gap-4">
        <a href="#catalogo" onclick="filterCatalog('todos')" class="px-8 py-4 bg-brand-gold text-brand-linen text-xs font-semibold tracking-[0.16em] uppercase hover:bg-brand-goldHover transition-all duration-300 shadow-md">
          Explorar Perfumes
        </a>
        <a href="#sobre" class="px-8 py-4 bg-transparent border border-brand-gold/50 text-brand-gold text-xs font-semibold tracking-[0.16em] uppercase hover:bg-brand-surface transition-all duration-300">
          Conhecer a Aveline
        </a>
      </div>
    </div>

    <!-- Carrossel de produtos em destaque -->
    <div class="lg:col-span-6 relative flex justify-center">
      <div id="hero-carousel" class="relative w-full max-w-md lg:max-w-lg">
        <div id="hero-slides" class="relative aspect-[4/5] rounded-sm overflow-hidden shadow-2xl bg-brand-cream/30 border border-brand-gold/30">
          <!-- slides preenchidos por products.js -->
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="spinner"></div>
          </div>
        </div>

        <!-- Indicadores (dots) -->
        <div id="hero-dots" class="flex justify-center gap-2 mt-4"></div>
      </div>
    </div>

  </div>
</section>
