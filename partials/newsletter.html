<!-- ================= NEWSLETTER ================= -->
<section class="max-w-[1380px] mx-auto px-4 sm:px-8 py-16">
  <div class="bg-brand-cream/60 border border-brand-gold/60 p-8 sm:p-12 text-center max-w-3xl mx-auto space-y-4">
    <span class="text-xs font-bold tracking-[0.25em] text-brand-gold uppercase">Comunidade Privada</span>
    <h3 class="font-serif text-3xl text-brand-wine">Receba novidades da AVELINE</h3>
    <p class="text-sm text-brand-dark/80 max-w-md mx-auto">
      Lançamentos, descobertas e experiências olfativas diretamente no seu e-mail.
    </p>
    <form onsubmit="handleNewsletter(event)" class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto pt-2">
      <label for="newsletter-email" class="sr-only">E-mail</label>
      <input id="newsletter-email" type="email" placeholder="Digite seu melhor e-mail" required class="flex-1 px-4 py-3 bg-white border border-brand-border text-sm focus:outline-none focus:border-brand-wine"/>
      <button type="submit" class="px-6 py-3 bg-brand-wine text-white text-xs font-bold tracking-widest uppercase hover:bg-brand-dark transition-colors disabled:opacity-60">
        Cadastrar
      </button>
    </form>
    <div id="newsletter-feedback" class="hidden text-xs text-brand-wine font-semibold mt-2">
      Obrigado! Você agora faz parte do nosso círculo exclusivo.
    </div>
  </div>
</section>
