  <link rel="canonical" href="https://avelineperfumaria.com.br/"/>
  <meta name="theme-color" content="#541623"/>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://avelineperfumaria.com.br/"/>
  <meta property="og:title" content="AVELINE – Perfumes Importados | Boutique & Curadoria de Nicho"/>

  <!-- Structured Data (SEO + AEO + SGE) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "AVELINE Perfumaria",
    "alternateName": "AVELINE – Perfumes Importados",
    "url": "https://avelineperfumaria.com.br",
    "description": "Boutique online de perfumaria de nicho e importada. Frascos originais lacrados e decantes artesanais 5ml e 10ml com envio para todo o Brasil.",
    "telephone": "+5545991321583",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "BR"
    },
    "sameAs": [
      "https://instagram.com/avelineperfumaria"
    ],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://avelineperfumaria.com.br/#catalogo",
      "query-input": "required name=search_term"
    },
    "makesOffer": {
      "@type": "AggregateOffer",
      "itemOffered": {
        "@type": "Product",
        "category": "Perfumes Importados"
      },
      "priceCurrency": "BRL",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AVELINE Perfumaria",
    "url": "https://avelineperfumaria.com.br",
    "inLanguage": "pt-BR",
    "publisher": {
      "@type": "Organization",
      "name": "AVELINE Perfumaria",
      "url": "https://avelineperfumaria.com.br"
    }
  }
  </script>

  <!-- FAQ Structured Data (AEO/SGE) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "O que é um decante de perfume?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Um decante é uma porção do perfume original transferida para um frasco menor (5ml ou 10ml), ideal para experimentar fragrâncias de nicho antes de comprar o frasco completo."
        }
      },
      {
        "@type": "Question",
        "name": "Os perfumes da AVELINE são originais?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim, todos os nossos perfumes são 100% originais, importados e lacrados. Trabalhamos exclusivamente com fragrâncias autênticas das melhores casas de perfumaria do mundo."
        }
      },
      {
        "@type": "Question",
        "name": "Quais marcas de perfume a AVELINE vende?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Trabalhamos com marcas de nicho como Parfums de Marly, Nishane, Tom Ford, Creed, Xerjoff, Amouage, Maison Francis Kurkdjian, entre outras."
        }
      },
      {
        "@type": "Question",
        "name": "A AVELINE envia para todo o Brasil?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim, realizamos envios para todo o território brasileiro com embalagem segura e rastreamento."
        }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
